name: rbac
description: 역할 기반 접근 제어 (ADMIN/USER)
category: auth
depends_on:
  - jwt-auth
files:
  - src: files/src/core/rbac.py
    dest: src/core/rbac.py
  - src: files/src/routers/admin.py
    dest: src/routers/admin.py
  - src: files/tests/test_rbac.py
    dest: tests/test_rbac.py
  - src: files/tests/test_admin.py
    dest: tests/test_admin.py
pip_packages: []
env_vars: []
routers:
  - module: src.routers.admin
    attr: router
    prefix: /admin
    tag: admin
docker_services: {}
