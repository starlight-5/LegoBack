name: jwt-auth
description: 회원가입·로그인·토큰 재발급 (JWT, SQL/MongoDB 둘 다 지원)
category: auth
depends_on:
  - settings
  - database
files:
  - src: files/src/routers/auth.py
    dest: src/routers/auth.py
    when: { "db_type": ["postgresql", "mysql", "supabase"] }
  - src: files/src/models/user.py
    dest: src/models/user.py
    when: { "db_type": ["postgresql", "mysql", "supabase"] }
  - src: files/tests/test_auth.py
    dest: tests/test_auth.py
    when: { "db_type": ["postgresql", "mysql", "supabase"] }
  - src: files/tests/conftest.py
    dest: tests/conftest.py
    when: { "db_type": ["postgresql", "mysql", "supabase"] }
  - src: files/src/routers/auth_mongo.py
    dest: src/routers/auth.py
    when: { "db_type": ["mongodb"] }
  - src: files/src/models/user_mongo.py
    dest: src/models/user.py
    when: { "db_type": ["mongodb"] }
  - src: files/tests/test_auth_mongo.py
    dest: tests/test_auth.py
    when: { "db_type": ["mongodb"] }
pip_packages:
  - python-jose[cryptography]>=3.3
  - passlib[bcrypt]>=1.7
  - bcrypt>=4.0,<4.1
  - email-validator>=2.0
env_vars:
  - name: JWT_SECRET_KEY
    default: ""
    description: 토큰 서명에 쓰는 비밀 키 (반드시 변경)
  - name: JWT_ACCESS_MINUTES
    default: "30"
    description: access 토큰 유효 시간(분)
  - name: JWT_REFRESH_MINUTES
    default: "10080"
    description: refresh 토큰 유효 시간(분, 기본 7일)
routers:
  - module: src.routers.auth
    attr: router
    prefix: /auth
    tag: auth
docker_services: {}
