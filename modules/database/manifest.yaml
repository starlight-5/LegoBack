name: database
description: SQLAlchemy + Alembic DB 연동 (PostgreSQL 기본)
category: data
depends_on:
  - settings
files:
  - src: files/src/core/db.py
    dest: src/core/db.py
    when : { "db_type" : ["postgresql"] }
pip_packages:
  - sqlalchemy>=2.0
  - alembic>=1.13
  - psycopg2-binary>=2.9
env_vars:
  - name: DATABASE_URL
    default: postgresql://app:app@db:5432/app
    description: DB 접속 주소 (호스트명 db = docker-compose 서비스명)
routers: []
docker_services:
  db:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
options:
  db_type:
    question: "사용할 데이터베이스 종류를 선택하세요"
    choices: [postgresql]
    default: postgresql
    # TODO [회의]: mysql/supabase/mongodb choices 추가는 후속 작업(C파트)
