name: database
description: SQLAlchemy + Alembic DB 연동 (PostgreSQL/MySQL/Supabase 지원)
category: data
depends_on:
  - settings
files:
  - src: files/src/core/db.py
    dest: src/core/db.py
    when: { "db_type": ["postgresql", "mysql", "supabase"] }
  - src: files/alembic.ini
    dest: alembic.ini
    when: { "db_type": ["postgresql", "mysql", "supabase"] }
  - src: files/migrations/env.py
    dest: migrations/env.py
    when: { "db_type": ["postgresql", "mysql", "supabase"] }
  - src: files/migrations/script.py.mako
    dest: migrations/script.py.mako
    when: { "db_type": ["postgresql", "mysql", "supabase"] }
  - src: files/migrations/versions/.gitkeep
    dest: migrations/versions/.gitkeep
    when: { "db_type": ["postgresql", "mysql", "supabase"] }
pip_packages:
  - sqlalchemy>=2.0
  - alembic>=1.13
  - spec: psycopg2-binary>=2.9
    when: { "db_type": ["postgresql", "supabase"] }
  - spec: pymysql>=1.1
    when: { "db_type": ["mysql"] }
env_vars:
  - name: DATABASE_URL
    default: postgresql://app:app@db:5432/app
    description: PostgreSQL 접속 주소 (호스트명 db = docker-compose 서비스명)
    when: { "db_type": ["postgresql"] }
  - name: DATABASE_URL
    default: mysql+pymysql://app:app@db-mysql:3306/app
    description: MySQL 접속 주소 (호스트명 db-mysql = docker-compose 서비스명)
    when: { "db_type": ["mysql"] }
  - name: DATABASE_URL
    default: ""
    description: Supabase 프로젝트의 Connection string (Project Settings > Database > Connection string, PostgreSQL 형식)을 그대로 붙여넣으세요
    when: { "db_type": ["supabase"] }
routers: []
docker_services:
  db:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    when: { "db_type": ["postgresql"] }
  db-mysql:
    image: mysql:8
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: app
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - db-mysql-data:/var/lib/mysql
    when: { "db_type": ["mysql"] }
options:
  db_type:
    question: "사용할 데이터베이스 종류를 선택하세요"
    choices: [postgresql, mysql, supabase]
    default: postgresql
    # TODO [회의]: mongodb는 별도 모듈(database-mongo)로 진행 예정, 여기 choices엔 추가 안 함
