[project]
name = "my-blog"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "bcrypt<4.1,>=4.0",
    "email-validator>=2.0",
    "fastapi>=0.115",
    "passlib[bcrypt]>=1.7",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
